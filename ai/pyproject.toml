[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnikernel"
version = "0.1.0"
description = "Autonomous AI System Monitor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115.0",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.2",
    "openai>=2.41.1",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tqdm>=4.68.2",
    "uvicorn>=0.30.0",
    "watchdog>=6.0.0",
]

[tool.setuptools]
py-modules = ["api", "chat", "clientAi", "health"]

[tool.setuptools.packages.find]
include = ["conf*", "code_assist*", "utils*"]
